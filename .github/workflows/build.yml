name: FFNET IOS — Build Dylib

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache Theos
      id: theos-cache
      uses: actions/cache@v4
      with:
        path: ~/theos
        key: theos-macos14-v7

    - name: Install Theos
      if: steps.theos-cache.outputs.cache-hit != 'true'
      run: |
        git clone --recurse-submodules --depth=1 \
          https://github.com/theos/theos.git ~/theos

    - name: Install iOS SDK
      if: steps.theos-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/theos/sdks
        curl -fsSL \
          "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS15.6.sdk.tar.xz" \
          -o /tmp/sdk.tar.xz
        tar -xJf /tmp/sdk.tar.xz -C ~/theos/sdks/
        rm /tmp/sdk.tar.xz

    - name: Setup substrate stub
      if: steps.theos-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/theos/lib ~/theos/include
        EXISTING=$(find ~/theos/vendor -name "libsubstrate.dylib" 2>/dev/null | head -1)
        if [ -n "$EXISTING" ]; then
          cp "$EXISTING" ~/theos/lib/libsubstrate.dylib
        else
          python3 -c "
        import struct
        open('${HOME}/theos/lib/libsubstrate.dylib','wb').write(
          struct.pack('<IIIIIII',0xFEEDFACF,0x0100000C,0,6,0,0,0))"
        fi
        if ! grep -q "MSHookFunction" ~/theos/include/substrate.h 2>/dev/null; then
          cat > ~/theos/include/substrate.h << 'SUB'
        #pragma once
        #ifdef __cplusplus
        extern "C" {
        #endif
        void MSHookFunction(void* sym, void* rep, void** res);
        void MSHookMessageEx(void* cls, SEL sel, IMP imp, IMP* res);
        #ifdef __cplusplus
        }
        #endif
        SUB
        fi

    - name: Build
      run: |
        export THEOS=~/theos
        make clean 2>/dev/null || true
        make ARCHS=arm64 TARGET="iphone:clang:16.5:15.0" FINALPACKAGE=1 DEBUG=0 \
             -j$(sysctl -n hw.ncpu)

        DYLIB=$(find .theos -name "FFNET_IOS.dylib" 2>/dev/null | head -1)
        if [ -z "$DYLIB" ]; then
          find . -name "*.dylib" 2>/dev/null | head -10; exit 1
        fi
        echo "DYLIB_PATH=$DYLIB" >> $GITHUB_ENV
        echo "✓ $DYLIB ($(du -h $DYLIB | cut -f1))"

    - name: Sign
      run: codesign --force --sign - --timestamp=none "${{ env.DYLIB_PATH }}"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: FFNET_IOS-OB54
        path: ${{ env.DYLIB_PATH }}
        retention-days: 30
