name: FFNET IOS — Build Dylib

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache Theos
      id: theos-cache
      uses: actions/cache@v4
      with:
        path: ~/theos
        key: theos-macos14-lib-v1

    - name: Install Theos
      if: steps.theos-cache.outputs.cache-hit != 'true'
      run: |
        git clone --recurse-submodules --depth=1 \
          https://github.com/theos/theos.git ~/theos

    - name: Install iOS SDK
      if: steps.theos-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/theos/sdks
        curl -fsSL \
          "https://github.com/theos/sdks/releases/download/2024Q4/iPhoneOS15.5.sdk.tar.xz" \
          -o /tmp/sdk.tar.xz
        tar -xJf /tmp/sdk.tar.xz -C ~/theos/sdks/
        rm /tmp/sdk.tar.xz

    - name: Setup substrate stub
      if: steps.theos-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/theos/lib ~/theos/include

        # substrate.h — check in vendor/include first
        if grep -qr "MSHookFunction" ~/theos/vendor/include/ 2>/dev/null; then
          cp $(grep -rl "MSHookFunction" ~/theos/vendor/include/ | head -1) \
             ~/theos/include/substrate.h
        else
          cat > ~/theos/include/substrate.h << 'SUB'
        #pragma once
        #ifdef __cplusplus
        extern "C" {
        #endif
        void MSHookFunction(void* sym, void* rep, void** res);
        void MSHookMessageEx(void* cls, SEL sel, IMP imp, IMP* res);
        #ifdef __cplusplus
        }
        #endif
        SUB
        fi

        # libsubstrate.dylib stub
        EXISTING=$(find ~/theos/vendor -name "libsubstrate.dylib" 2>/dev/null | head -1)
        if [ -n "$EXISTING" ]; then
          cp "$EXISTING" ~/theos/lib/libsubstrate.dylib
        else
          python3 -c "
        import struct
        open('${HOME}/theos/lib/libsubstrate.dylib','wb').write(
          struct.pack('<IIIIIII', 0xFEEDFACF, 0x0100000C, 0, 6, 0, 0, 0))
        "
        fi

    - name: Verify env
      run: |
        export THEOS=~/theos
        echo "library.mk : $(ls $THEOS/makefiles/library.mk && echo OK || echo MISSING)"
        echo "common.mk  : $(ls $THEOS/makefiles/common.mk  && echo OK || echo MISSING)"
        echo "SDK        : $(ls $THEOS/sdks/*.sdk 2>/dev/null | head -1 | xargs basename || echo MISSING)"
        echo "substrate.h: $([ -f $THEOS/include/substrate.h ] && echo OK || echo MISSING)"
        echo "libsubst   : $([ -f $THEOS/lib/libsubstrate.dylib ] && echo OK || echo MISSING)"
        echo "clang      : $(clang --version | head -1)"

    - name: Build
      run: |
        export THEOS=~/theos
        make clean 2>/dev/null || true
        make ARCHS=arm64 TARGET="iphone:clang:16.5:15.0" FINALPACKAGE=1 DEBUG=0 \
             -j$(sysctl -n hw.ncpu)

        DYLIB=$(find .theos -name "FFNET_IOS.dylib" 2>/dev/null | head -1)
        if [ -z "$DYLIB" ]; then
          echo "ERROR: dylib not found. Searching..."
          find .theos -name "*.dylib" -o -name "*.a" 2>/dev/null | head -20
          exit 1
        fi
        echo "DYLIB_PATH=$DYLIB" >> $GITHUB_ENV
        echo "✓ $DYLIB ($(du -h $DYLIB | cut -f1))"

    - name: Sign
      run: |
        codesign --force --sign - --timestamp=none "${{ env.DYLIB_PATH }}"

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: FFNET_IOS-OB54
        path: ${{ env.DYLIB_PATH }}
        retention-days: 30
