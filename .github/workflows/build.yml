name: FFNET IOS — Build Dylib

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build FFNET_IOS.dylib
    runs-on: macos-14          # Apple Silicon — ARM64 native, fastest for iOS toolchain

    steps:

    # ── 1. Checkout ───────────────────────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v4

    # ── 2. Cache Theos + SDK ──────────────────────────────────────────────────
    - name: Cache Theos
      id: theos-cache
      uses: actions/cache@v4
      with:
        path: ~/theos
        key: theos-macos14-v6

    # ── 3. Install Theos (if not cached) ─────────────────────────────────────
    - name: Install Theos
      if: steps.theos-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        export THEOS=~/theos

        # Clone Theos main repo + all submodules
        git clone --recurse-submodules --depth=1 \
          https://github.com/theos/theos.git "$THEOS"

        # Verify dylib.mk landed correctly
        if [ ! -f "$THEOS/makefiles/dylib.mk" ]; then
          echo "ERROR: dylib.mk not found after clone"
          ls "$THEOS/makefiles/" || true
          exit 1
        fi
        echo "✓ Theos cloned — dylib.mk present"

    # ── 4. Install iOS SDK (if not cached) ───────────────────────────────────
    - name: Install iOS SDK
      if: steps.theos-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        export THEOS=~/theos
        mkdir -p "$THEOS/sdks"

        echo "Downloading iPhoneOS15.5.sdk..."
        curl -fsSL \
          "https://github.com/theos/sdks/releases/download/2024Q4/iPhoneOS15.5.sdk.tar.xz" \
          -o /tmp/sdk.tar.xz

        tar -xJf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
        rm /tmp/sdk.tar.xz

        echo "✓ SDK installed:"
        ls "$THEOS/sdks/"

    # ── 5. Verify substrate.h ─────────────────────────────────────────────────
    - name: Verify substrate.h
      if: steps.theos-cache.outputs.cache-hit != 'true'
      run: |
        export THEOS=~/theos
        mkdir -p "$THEOS/include"

        # substrate.h ships with Theos — verify
        if grep -q "MSHookFunction" "$THEOS/include/substrate.h" 2>/dev/null; then
          echo "✓ substrate.h OK"
        else
          echo "substrate.h missing or invalid — writing stub"
          cat > "$THEOS/include/substrate.h" << 'SUBEOF'
        #pragma once
        #include <stddef.h>
        #ifdef __cplusplus
        extern "C" {
        #endif
        void  MSHookFunction(void* symbol, void* replace, void** result);
        void* MSFindSymbol(void* image, const char* name);
        void  MSHookMessageEx(void* cls, SEL sel, IMP imp, IMP* result);
        #ifdef __cplusplus
        }
        #endif
        SUBEOF
          echo "✓ substrate.h stub written"
        fi

    # ── 6. Write libsubstrate stub for linker ─────────────────────────────────
    - name: libsubstrate linker stub
      if: steps.theos-cache.outputs.cache-hit != 'true'
      run: |
        export THEOS=~/theos
        mkdir -p "$THEOS/lib"
        if [ ! -f "$THEOS/lib/libsubstrate.dylib" ]; then
          # Look inside theos vendor dirs first
          EXISTING=$(find "$THEOS" -name "libsubstrate.dylib" \
                     ! -path "$THEOS/lib/*" 2>/dev/null | head -1)
          if [ -n "$EXISTING" ]; then
            cp "$EXISTING" "$THEOS/lib/libsubstrate.dylib"
            echo "✓ libsubstrate.dylib copied from $EXISTING"
          else
            # Write a minimal ARM64 Mach-O dylib stub
            python3 -c "
        import struct
        hdr = struct.pack('<IIIIIII',
            0xFEEDFACF,  # MH_MAGIC_64
            0x0100000C,  # CPU_TYPE_ARM64
            0,           # CPU_SUBTYPE_ALL
            6,           # MH_DYLIB
            0, 0, 0)
        open(\"$THEOS/lib/libsubstrate.dylib\", 'wb').write(hdr)
        print('stub written')
        "
          fi
        else
          echo "✓ libsubstrate.dylib already present"
        fi

    # ── 7. Verify Theos environment ───────────────────────────────────────────
    - name: Verify Theos
      run: |
        export THEOS=~/theos
        echo "=== Theos environment ==="
        echo "THEOS=$THEOS"
        echo "dylib.mk: $(ls $THEOS/makefiles/dylib.mk 2>/dev/null && echo OK || echo MISSING)"
        echo "SDK:      $(ls $THEOS/sdks/*.sdk 2>/dev/null | head -1 | xargs basename || echo MISSING)"
        echo "subst.h:  $([ -f $THEOS/include/substrate.h ] && echo OK || echo MISSING)"
        echo "libsubst: $([ -f $THEOS/lib/libsubstrate.dylib ] && echo OK || echo MISSING)"
        echo "clang:    $(clang --version | head -1)"
        echo "make:     $(make --version | head -1)"

    # ── 8. Build ──────────────────────────────────────────────────────────────
    - name: Build dylib
      run: |
        set -euo pipefail
        export THEOS=~/theos

        make clean 2>/dev/null || true
        make \
          ARCHS=arm64 \
          TARGET="iphone:clang:16.5:15.0" \
          FINALPACKAGE=1 \
          DEBUG=0 \
          -j$(sysctl -n hw.ncpu)

        # Locate the dylib
        DYLIB=$(find .theos -name "FFNET_IOS.dylib" 2>/dev/null | head -1)
        if [ -z "$DYLIB" ]; then
          echo "ERROR: FFNET_IOS.dylib not found after build"
          find .theos -name "*.dylib" 2>/dev/null | head -10 || true
          exit 1
        fi

        echo "✓ Built: $DYLIB"
        ls -lh "$DYLIB"
        echo "DYLIB_PATH=$DYLIB" >> $GITHUB_ENV

    # ── 9. Ad-hoc sign (for esign re-sign) ───────────────────────────────────
    - name: Sign dylib
      run: |
        codesign --force --sign - --timestamp=none "${{ env.DYLIB_PATH }}"
        echo "✓ Ad-hoc signed"

    # ── 10. Stage artifact ────────────────────────────────────────────────────
    - name: Stage artifact
      run: |
        mkdir -p artifact
        cp "${{ env.DYLIB_PATH }}" artifact/FFNET_IOS.dylib
        cp scripts/entitlements.plist artifact/

        cat > artifact/INSTALL.txt << 'EOF'
        FFNET IOS — V1.0.0 Beta — OB54
        Target: com.dts.freefireth | iOS 15+ ARM64
        ═══════════════════════════════════════
        INSTALL via esign:
          1. AirDrop / Files → FFNET_IOS.dylib to device
          2. esign → Apps → Free Fire → Inject Dylib
          3. Pick FFNET_IOS.dylib → Launch Free Fire
          4. Triple-tap screen → menu opens

        INSTALL via sideloadly:
          1. Drag Free Fire IPA into sideloadly
          2. Inject → add FFNET_IOS.dylib
          3. Install → Launch → Triple-tap
        EOF

        ls -lh artifact/

    # ── 11. Upload artifact ───────────────────────────────────────────────────
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FFNET_IOS-OB54
        path: artifact/
        retention-days: 30

    # ── 12. Summary ───────────────────────────────────────────────────────────
    - name: Summary
      run: |
        SIZE=$(du -h "${{ env.DYLIB_PATH }}" | cut -f1)
        echo "## ✅ FFNET IOS Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "| | |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| **File** | \`FFNET_IOS.dylib\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Size** | $SIZE |" >> $GITHUB_STEP_SUMMARY
        echo "| **Target** | iOS 15+ ARM64 |" >> $GITHUB_STEP_SUMMARY
        echo "| **Version** | V1.0.0 Beta OB54 |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "⬆️ Download from **Artifacts** tab above" >> $GITHUB_STEP_SUMMARY
